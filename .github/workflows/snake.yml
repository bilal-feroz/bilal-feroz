name: Generate contribution snake

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'bilal-feroz/bilal-feroz'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bilal-feroz
          # moonlit palette: cells brighten from night sky to moonlight, the snake is pale gold
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#b8923f&color_dots=#ebedf0,#d3dae6,#9aa7bd,#5f6d87,#232c3d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e9dcc0&color_dots=#161b22,#28303f,#4f5b73,#95a3bb,#eef2f8

      - name: Publish generated assets to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
